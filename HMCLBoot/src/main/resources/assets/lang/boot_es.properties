boot.unsupported_java_version=HMCL requiere Java 17 o posterior para ejecutarse, pero sigue admitiendo el inicio de juegos con Java 6~16.\nPor favor, instala la última versión de Java e intenta ejecutar HMCL de nuevo.\nPuedes conservar tu versión antigua de Java. HMCL puede detectar y gestionar múltiples instalaciones de Java,\ny seleccionará automáticamente la versión de Java adecuada para tu juego.
boot.manual_update=HMCL no puede completar las actualizaciones automáticas en el entorno actual. Descarga manualmente la versión más reciente de HMCL.\n¿Quieres ir a la página de descarga?

boot.message.error=Error
boot.java_runtime.title=Preparando el entorno de ejecución de Java
boot.java_runtime.notes=FSL requiere Java 17 o posterior para ejecutarse.\nFSL preparará automáticamente un entorno de ejecución de Java adecuado, sin necesidad de instalarlo manualmente.\nMantén FSL en ejecución y no cierres esta ventana.
boot.java_runtime.prepare=Preparando...
boot.java_runtime.failed=FSL no ha podido preparar un entorno de ejecución de Java automáticamente.\n\nMotivo:\n%s\n\nComprueba tu conexión de red y pulsa "Reintentar", o pulsa "Cancelar" para cerrar FSL.
boot.java_runtime.retry=Reintentar
boot.java_runtime.cancel=Cancelar
