boot.unsupported_java_version=HMCL 需要 Java 17 或更高版本才能執行，但依然支援使用 Java 6~16 啟動遊戲。請安裝最新版本的 Java 再嘗試開啟 HMCL。\n你可以繼續保留舊版本 Java。HMCL 能夠識別與管理多個 Java，並會自動根據遊戲版本為你選取合適的 Java。
boot.manual_update=HMCL 在當前環境無法完成自動更新，請手動下載最新版本的 HMCL。\n是否前往下載頁面？

boot.message.error=錯誤
boot.java_runtime.title=正在準備 Java 執行環境
boot.java_runtime.notes=FSL 需要 Java 17 或更高版本才能執行。\nFSL 會自動準備合適的 Java 執行環境，無需手動安裝。\n請保持 FSL 執行，不要關閉此視窗。
boot.java_runtime.prepare=正在準備……
boot.java_runtime.failed=FSL 無法自動準備 Java 執行環境。\n\n原因：\n%s\n\n請檢查網路連線後點選"重試"，或點選"取消"關閉 FSL。
boot.java_runtime.retry=重試
boot.java_runtime.cancel=取消
